      let left;try{left=Math.ceil(A.remaining()/1000);}catch(e){left=0;}
      h='<h3>蘑菇秘境</h3><p>每天共 30 分鐘 · 今日剩餘 '+Math.floor(left/60)+' 分 '+left%60+' 秒</p><p>只出現蘑菇。基礎經驗 17 → 17,000；每日台灣時間 00:00 重置。此副本不計離線戰鬥。</p>'+button('進入蘑菇秘境','mushroom',left<=0);
      h+='<h3>夢域鏡自動遠征</h3><p>一般夢域鏡每輪 10,000 龍鑽；次元裂縫副本每輪 1,000 血龍鑽。兩類分開啟動，不混排。各副本原有門票另計；戰敗或離場會暫停，繼續已付款輪次不再收啟動費。</p><p>守護者之戒可勾選五位騎士的試煉，每輪各挑戰一次，劇情與每日次數照原規則。黃道十二宮二轉後開放，每日三選一，當天只能挑戰一宮。</p>';
      const r=A.round();if(r)h+='<p>本輪：'+esc({running:'進行中',paused:'暫停',between:'準備下一項',done:'完成',cancelled:'已結束',starting:'準備中'}[r.status]||r.status)+' · '+r.completed.length+'/'+r.queue.length+' · '+esc(r.reason||'')+'</p>'+(r.status==='paused'?button('繼續已付款的本輪','resume'):r.status==='running'?button('暫停','pause'):'')+(!['done','cancelled'].includes(r.status)?button('結束本輪','cancel'):'');
      h+='<div class="growth-job-groups">'+[['dream','一般夢域鏡 · 10,000 龍鑽'],['rift','次元裂縫 · 1,000 血龍鑽']].map(([id,n])=>'<button type="button" data-growth="jobGroup:'+id+'" aria-pressed="'+(jobGroup===id)+'">'+n+'</button>').join('')+'</div><div class="growth-queue">'+A.rows().filter(x=>(x.kind||(x.id.startsWith('rd:')?'rift':'dream'))===jobGroup).map(x=>{const why=A.why(x.id);return '<label><input type="checkbox" name="growth-job" value="'+esc(x.id)+'" '+(x.points&&!why?'checked':'')+(why?' disabled':'')+'><span>'+esc(x.name)+(x.points?' · 遠征點數':'')+'<small>'+esc(x.fee)+(why?' · '+esc(why):'')+'</small></span></label>';}).join('')+'</div><label>哈汀劇情選擇 <select id="growth-hardin"><option value="ritual">讓儀式完成</option><option value="stop">阻止儀式</option></select></label><div class="growth-actions">'+button('選擇副本後開始一輪','start',r&&!['done','cancelled'].includes(r.status))+'</div>';
    }
    const body=panel.querySelector('.growth-body'),top=body.scrollTop,left=body.querySelector('.growth-tree-scroll')?.scrollLeft||0,focus=document.activeElement?.dataset?.growth;
    body.innerHTML=h;body.scrollTop=top;const tree=body.querySelector('.growth-tree-scroll');if(tree)tree.scrollLeft=left;
    if(focus){const b=[...panel.querySelectorAll('[data-growth]')].find(x=>x.dataset.growth===focus);if(b&&!b.disabled)b.focus({preventScroll:true});}
    panel.querySelector('footer [role="status"]').textContent='持有血龍鑽 '+G.blood().toLocaleString();if(tab==='activities')updateQuote();
  }
  function updateQuote(){if(!panel)return;const b=panel.querySelector('[data-growth="start"]');if(!b)return;try{const q=A.quote([...panel.querySelectorAll('input[name="growth-job"]:checked')].map(x=>x.value));b.textContent='確認支付 '+q.label+'，開始一輪';b.disabled=!!A.round()&&!['done','cancelled'].includes(A.round().status);}catch(e){b.textContent=e.message;b.disabled=true;}}
  function click(e){const b=e.target.closest('[data-growth]');if(!b||b.disabled)return;const [cmd,arg]=b.dataset.growth.split(':');try{
    if(cmd==='backup'){G.downloadBackup();return;}if(cmd==='close'){close();return;}if(cmd==='tab'){tab=arg;panel.querySelector('.growth-body').scrollTop=0;}if(cmd==='direction'){direction=arg;selected=arg+'.A.1';}if(cmd==='jobGroup')jobGroup=arg;
    if(cmd==='node'){selected=arg;if(V.state(G.read(player),draft,arg,player.rebirth||0)==='available')draft=C.add(draft,arg);}if(cmd==='j'&&G.read(player).unlocked&&!draft.j&&draft.order.length===3&&draft.order.every(d=>C.complete(draft,d,'K'))&&C.spent(draft)+3<=C.earned(G.read(player),player.rebirth||0))draft.j=true;
    if(cmd==='clearTalent')draft={order:[],nodes:[],j:false};if(cmd==='clearParagon')pg={};
    if(cmd==='pg+'||cmd==='pg-'){const g=G.read(player),d=C.paragon[arg];if(!g||!d)return;const used=Object.values(pg).reduce((a,b)=>a+b,0),n=pg[arg]||0;if(cmd==='pg+'&&g.unlocked&&used<g.paragon.level&&n<Math.min(700,Math.ceil(d.cap/d.step)))pg[arg]=n+1;else if(cmd==='pg-')pg[arg]=Math.max(0,n-1);V.updateParagon(panel,g,pg);return;}
    if(cmd==='saveTalent'){G.commitTalent(draft);draft=C.copy(G.read(player).talent);}if(cmd==='saveParagon'){G.commitParagon(pg);pg=C.copy(G.read(player).paragon.points);}
    if(cmd==='mushroom'){A.enterMushroom();close();W.LineageMobile?.go('adventure');return;}
    if(cmd==='start'){A.start([...panel.querySelectorAll('input[name="growth-job"]:checked')].map(x=>x.value),panel.querySelector('#growth-hardin').value);close();W.LineageMobile?.go('adventure');return;}
    if(cmd==='resume'){A.resume();close();return;}if(cmd==='pause')A.pause('玩家暫停');if(cmd==='cancel')A.cancel();render();if(cmd==='saveTalent'||cmd==='saveParagon')error('配置已保存');
  }catch(err){error(err);}}
  function refreshSummary(){const host=document.getElementById('tab-stats');if(!host)return;let bar=document.getElementById('growth-launch');if(!bar){bar=document.createElement('div');bar.id='growth-launch';bar.className='growth-actions';bar.innerHTML=button('天賦・巔峰','open');bar.addEventListener('click',e=>{if(e.target.closest('button'))open('talent');});host.prepend(bar);}}
  function clock(){let el=document.getElementById('growth-clock');if(mapState.current!==A.MAP){el?.remove();return;}if(!el){el=document.createElement('div');el.id='growth-clock';document.getElementById('battle-view')?.appendChild(el);}try{const n=Math.ceil(A.remaining()/1000);const text='蘑菇秘境 '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(el.textContent!==text)el.textContent=text;}catch(e){el.textContent='副本時間紀錄異常';}}
  const npc=W.interactNPC;if(npc)W.interactNPC=function(id){const result=npc.apply(this,arguments);if(id===W.__afkExpedition?.NPC_ID){const host=document.getElementById('afk-exped');if(host&&!host.querySelector('[data-growth-entry]')){const b=document.createElement('button');b.className='btn';b.dataset.growthEntry='activities';b.textContent='秘境與自動遠征';b.onclick=()=>{W.closeNpcInteraction?.();open('activities');};host.prepend(b);}}return result;};
  W.LineageGrowthUI={open,close,render,refreshSummary,clock};refreshSummary();
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel)close();});
})(window);
</script></body></html>
